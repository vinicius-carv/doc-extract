name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: ./mvnw -q verify
      - name: Eval baseline gate
        run: java -jar target/doc-extract-0.1.0-SNAPSHOT.jar --eval
